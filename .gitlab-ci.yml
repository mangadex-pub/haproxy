stages:
  - "render"
  - "trigger"

render:
  stage: "render"
  image: "alpine:latest"
  script: |
    set -euo pipefail

    source ./tool/ci-tools.sh

    section_start "install-pkl" "Install Pkl (version = ${PKL_VERSION})"
    if ! [ -f "./pkl-${PKL_VERSION}" ]; then
      echo "Install PKL v${PKL_VERSION}"
      wget -O ./pkl-${PKL_VERSION} "https://github.com/apple/pkl/releases/download/${PKL_VERSION}/pkl-alpine-linux-amd64"
      chmod +x ./pkl-${PKL_VERSION}
    fi
    section_end "install-pkl"

    for distribution in debian rockylinux; do
      section_start "render-$distribution" "Render pipeline (distribution = $distribution)"
      ./pkl-${PKL_VERSION} eval -w ".gitlab" -f "yaml" "ci-$distribution.pkl" | tee ".gitlab/$distribution.ci.yml"
      section_end "render-$distribution"
    done
  variables:
    PKL_VERSION: "0.28.2"
  cache:
    key: "pkl-${PKL_VERSION}"
    paths: [ "pkl-${PKL_VERSION}" ]
  artifacts:
    paths:
      - ".gitlab/debian.ci.yml"
      - ".gitlab/rockylinux.ci.yml"

trigger:
  stage: "trigger"
  needs: [ "render" ]
  parallel:
    matrix:
      - OS_FAMILY: [ "debian", "rockylinux" ]
  trigger:
    strategy: "depend"
    include:
      - job: "render-pipeline"
        artifact: ".gitlab/$OS_FAMILY.ci.yml"
