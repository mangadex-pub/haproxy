render-pipeline:
  stage: "prepare"
  image: "alpine:latest"
  script: |
    set -euo pipefail

    if ! [ -f "/opt/pkl" ]; then
      echo "Install PKL v${PKL_VERSION}"
      wget -O /opt/pkl "https://github.com/apple/pkl/releases/download/${PKL_VERSION}/pkl-alpine-linux-amd64"
      chmod +x /opt/pkl
    fi

    /opt/pkl eval -w ".gitlab" -f yaml "ci-debian.pkl" | tee ".gitlab/debian.ci.yml"
    /opt/pkl eval -w ".gitlab" -f yaml "ci-rockylinux.pkl" | tee ".gitlab/rockylinux.ci.yml"
  variables:
    PKL_VERSION: "0.28.2"
  cache:
    key: "pkl-${PKL_VERSION}"
    paths: [ "/opt/pkl" ]
  artifacts:
    paths: [ ".gitlab/ci.rendered.yml" ]

trigger-dynamic:
  stage: "run"
  needs: [ "render-pipeline" ]
  parallel:
    matrix:
      - OS_FAMILY: [ "debian", "rockylinux" ]
  trigger:
    strategy: "depend"
    include:
      - job: "render-pipeline"
        artifact: ".gitlab/$OS_FAMILY.ci.yml"
