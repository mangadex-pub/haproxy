on:
  workflow_call:
    inputs:
      OS_FAMILY: { type: "string", required: true }
      OS_IMAGE: { type: "string", required: true }
      OS_PACKAGING: { type: "string", required: true }

defaults:
  run:
    shell: "bash"

env:
  REGISTRY: "ghcr.io"
  IMAGE_NAME: "${{ github.repository }}"

jobs:
  dependencies:
    runs-on: "ubuntu-latest"
    container: "${{ inputs.OS_IMAGE }}"
    permissions:
      contents: "read"
      packages: "write"
    steps:
      - { uses: "actions/checkout@v4" }
      - { uses: "./.github/actions/setup-os", with: { OS_FAMILY: "${{ inputs.OS_FAMILY }}" } }
      - name: "Build dependencies"
        run: "make deps"
      - { uses: "./.github/actions/archive-deps", with: { OS_FAMILY: "${{ inputs.OS_FAMILY }}" } }

  regtests:
    runs-on: "ubuntu-latest"
    container: "${{ inputs.OS_IMAGE }}"
    needs: [ "dependencies" ]
    permissions: { contents: "read" }
    strategy:
      matrix: { BUILD_FLAVOUR: [ "dev", "stable" ] }
    steps:
      - { uses: "actions/checkout@v4" }
      - { uses: "./.github/actions/setup-os", with: { OS_FAMILY: "${{ inputs.OS_FAMILY }}" } }
      - { uses: "./.github/actions/retrieve-deps", with: { OS_FAMILY: "${{ inputs.OS_FAMILY }}" } }
      - name: "Run regtests"
        run: |
          set -euo pipefail

          export HAPROXY_GITREPO=$(jq -r '.${{ matrix.BUILD_FLAVOUR }}.git_repo' ci.json)
          export HAPROXY_GITREF=$(jq -r '.${{ matrix.BUILD_FLAVOUR }}.git_ref' ci.json)
          export HAPROXY_VERSION=$(jq -r '.${{ matrix.BUILD_FLAVOUR }}.version' ci.json)
          export HAPROXY_OPTIMIZATION="-Og"

          make -C haproxy build test

  package:
    runs-on: "ubuntu-latest"
    container: "${{ inputs.OS_IMAGE }}"
    needs: [ "regtests" ]
    permissions: { contents: "read", packages: "write" }
    strategy:
      matrix: { BUILD_FLAVOUR: [ "dev", "stable" ] }
    steps:
      - { uses: "actions/checkout@v4" }
      - { uses: "./.github/actions/setup-os", with: { OS_FAMILY: "${{ inputs.OS_FAMILY }}" } }
      - { uses: "./.github/actions/retrieve-deps", with: { OS_FAMILY: "${{ inputs.OS_FAMILY }}" } }
      - { name: "Install FPM", run: "gem install fpm" }
      - name: "Build package"
        run: |
          set -euo pipefail

          export HAPROXY_GITREPO=$(jq -r '.${{ matrix.BUILD_FLAVOUR }}.git_repo' ci.json)
          export HAPROXY_GITREF=$(jq -r '.${{ matrix.BUILD_FLAVOUR }}.git_ref' ci.json)
          export HAPROXY_VERSION=$(jq -r '.${{ matrix.BUILD_FLAVOUR }}.version' ci.json)
          if [ "${{ matrix.BUILD_FLAVOUR }}" == "dev" ]; then
            export HAPROXY_OPTIMIZATION="-Og"
          fi

          make -C haproxy build dist-${{ inputs.OS_PACKAGING }}
      - name: "Archive package"
        uses: "actions/upload-artifact@v4"
        with:
          name: "haproxy-${{ matrix.BUILD_FLAVOUR }}.${{ inputs.OS_PACKAGING }}"
          path: "haproxy/*.${{ inputs.OS_PACKAGING }}"

  docker:
    runs-on: "ubuntu-latest"
    needs: [ "package" ]
    permissions: { contents: "read", packages: "write" }
    strategy:
      matrix: { BUILD_FLAVOUR: [ "dev", "stable" ] }
    steps:
      - { uses: "actions/checkout@v4" }
      - { uses: "docker/setup-qemu-action@v3" }
      - { uses: "docker/setup-buildx-action@v3" }
      - name: "Log in to the Container registry"
        uses: "docker/login-action@v3"
        with:
          registry: "${{ env.REGISTRY }}"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - name: "Extract metadata (tags, labels) for Docker"
        id: "meta"
        uses: "docker/metadata-action@v5"
        with:
          images: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          tags: |
            type=raw,event=push,enable=true,value=branch-{{ branch }}-${{ steps.buildvars.haproxy_version }}-${{ inputs.OS_FAMILY }}
            type=sha,event=push,enable=true,prefix=branch-{{ branch }}-${{ steps.buildvars.haproxy_version }}-${{ inputs.OS_FAMILY }}-hap-${{ steps.buildvars.haproxy_gitref }}-mdx-,format=short
            type=raw,event=push,enable={{ is_default_branch }},value=${{ steps.buildvars.haproxy_version }}-${{ inputs.OS_FAMILY }}
            type=sha,event=push,enable={{ is_default_branch }},prefix=${{ steps.buildvars.haproxy_version }}-${{ inputs.OS_FAMILY }}-hap-${{ steps.buildvars.haproxy_gitref }}-mdx-,format=short
      - name: "Fetch package"
        uses: "actions/download-artifact@v4"
        with:
          name: "haproxy-${{ matrix.BUILD_FLAVOUR }}.${{ inputs.OS_PACKAGING }}"
          path: "haproxy"
      - name: "Build and push Docker image"
        uses: "docker/build-push-action@v5"
        with:
          context: "."
          file: "${{ inputs.OS_FAMILY }}.dockerfile"
          push: true
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
