on:
  push:
    branches: [ "*" ]
    tags: [ "*" ]

jobs:
  debian:
    uses: "./.github/workflows/pipeline.yml"
    with:
      OS_FAMILY: "debian"
      OS_IMAGE: "ghcr.io/mangadex-pub/containers-base/debian:bookworm-develroot"
      OS_PACKAGING: "deb"

  rockylinux:
    uses: "./.github/workflows/pipeline.yml"
    with:
      OS_FAMILY: "rockylinux"
      OS_IMAGE: "ghcr.io/mangadex-pub/containers-base/rockylinux:9-develroot"
      OS_PACKAGING: "rpm"
